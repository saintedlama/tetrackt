name: test-linux-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            cc: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Generate wavetable archive
        run: make compress

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath -ldflags="-s -w" -o "tetrackt_linux_${{ matrix.goarch }}" .
